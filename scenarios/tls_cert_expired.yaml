id: tls_cert_expired
name: TLS certificate expired on ingress
tags: [logs, tls, ingress]
incident:
  title: TLS handshake failures — public-api ingress
  service: ingress-nginx-public
  description: External clients report SSL errors; cert for api.example.com may be expired.
  symptoms: TLS alert certificate expired, 502 from load balancer, cert-manager last renew failed
metrics_summary: |
  nginx_ingress_controller_ssl_expire_time_seconds{host="api.example.com"}: negative offset
  certmanager_certificate_ready_status{ name="api-example-com-tls"}: 0
runbook_excerpt: |
  Expired cert: verify cert-manager Certificate resource, force renew, or rollback ingress secret to previous valid cert.
