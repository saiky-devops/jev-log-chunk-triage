id: routine_health_polls
name: Routine health-check log noise only
tags: [logs, noise]
incident:
  title: Log volume alert — checkout-api
  service: checkout-api
  description: Log indexer flagged volume spike; may be routine probe traffic during sale event.
  symptoms: INFO-level volume up, no error rate increase
metrics_summary: |
  error_rate: 0.01% unchanged
  log_volume_info: +40% (probe traffic)
runbook_excerpt: |
  Log volume spikes from kube-probe traffic during scale-up are often benign if error rates stable.
