id: db_connection_cascade
name: Database unreachable cascade
tags: [logs, dependency]
incident:
  title: High 503 rate — api-gateway
  service: api-gateway
  description: Gateway returning 503s; postgres-primary may be unreachable.
  symptoms: postgres_up=0, connection refused errors across pods
metrics_summary: |
  http_5xx_rate{service="api-gateway"}: 78% last 10m
  postgres_up{instance="postgres-primary"}: 0
runbook_excerpt: |
  DB unreachable: escalate to DBA. Do not restart app pods until postgres_up restored.
log_chunks:
  - id: chunk_01
    is_signal: false
    content: |
      2026-10-06T14:00:01Z INFO  AccessLog - GET /health 200 1ms
      2026-10-06T14:00:02Z INFO  AccessLog - GET /favicon.ico 404 2ms
  - id: chunk_02
    is_signal: true
    content: |
      2026-10-06T14:00:10Z ERROR DatabasePool - connection to postgres-primary:5432 failed Connection refused
      2026-10-06T14:00:10Z ERROR RequestHandler - dependency failure database unreachable retries=exhausted
      2026-10-06T14:00:10Z ERROR HttpServer - responding 503 upstream=postgres-primary
  - id: chunk_03
    is_signal: false
    content: |
      2026-10-06T14:00:05Z DEBUG Cache - local cache hit rate 0.88
      2026-10-06T14:00:06Z INFO  RateLimiter - tokens available bucket=full
  - id: chunk_04
    is_signal: true
    content: |
      2026-10-06T14:00:11Z ERROR api-gateway-7f8c - ERROR connection postgres-primary:5432 failed after 30s
      Multiple pods reporting same dependency failure pattern
  - id: chunk_05
    is_signal: false
    content: |
      2026-10-06T13:59:50Z INFO  AccessLog - GET /static/app.js 200 12ms
      2026-10-06T13:59:51Z INFO  AccessLog - GET /static/style.css 200 8ms
  - id: chunk_06
    is_signal: false
    content: |
      2026-10-06T13:59:40Z DEBUG tracing - span batch exported count=35
  - id: chunk_07
    is_signal: false
    content: |
      2026-10-06T13:59:30Z INFO  scheduler - heartbeat task completed ok
  - id: chunk_08
    is_signal: false
    content: |
      2026-10-06T13:59:20Z DEBUG GC - gc pause 12ms
expected:
  diagnosis_contains:
    - database
    - escalate
  required_signal_chunks:
