id: rate_limit_storm
name: Rate limit storm from upstream timeout
tags: [logs, api, cascade]
incident:
  title: 429 spike — checkout-api
  service: checkout-api
  description: Clients flooded with 429 Too Many Requests; upstream payment-svc may be timing out.
  symptoms: http 429 rate 40%, payment-svc p99 30s, circuit breaker half-open
metrics_summary: |
  http_requests_total{status="429",service="checkout-api"}: +2400/min
  http_client_duration_seconds{upstream="payment-svc",quantile="0.99"}: 30.2
runbook_excerpt: |
  429 storm: identify upstream timeout root cause before raising rate limits. Escalate payment-svc if dependency unhealthy.
